<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MolmoBot Frame Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    color: #ccc;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  #hud {
    display: flex;
    gap: 2em;
    padding: 8px 16px;
    font-size: 14px;
    background: #222;
    width: 100%;
    justify-content: center;
  }
  #hud .label { color: #888; }
  #hud .value { color: #0f0; }
  #hud .value.disconnected { color: #f44; }
  #frame-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    overflow: hidden;
  }
  #frame {
    max-width: 100%;
    max-height: 100%;
    image-rendering: auto;
  }
  #overlay {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 18px;
    color: #888;
  }
</style>
</head>
<body>

<div id="hud">
  <span><span class="label">Status: </span><span id="status" class="value disconnected">Connecting...</span></span>
  <span><span class="label">Episode: </span><span id="episode" class="value">-</span></span>
  <span><span class="label">Step: </span><span id="step" class="value">-</span></span>
  <span><span class="label">FPS: </span><span id="fps" class="value">-</span></span>
</div>

<div id="frame-container">
  <img id="frame" alt="">
  <div id="overlay">Waiting for frames...</div>
</div>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const wsHost = params.get("host") || window.location.host;
  const wsUrl = "ws://" + wsHost;

  const statusEl  = document.getElementById("status");
  const episodeEl = document.getElementById("episode");
  const stepEl    = document.getElementById("step");
  const fpsEl     = document.getElementById("fps");
  const frameEl   = document.getElementById("frame");
  const overlayEl = document.getElementById("overlay");

  let prevBlobUrl = null;
  let frameCount = 0;
  let lastFpsTime = performance.now();
  let pendingMeta = null;
  let reconnectDelay = 1000;

  function updateFps() {
    frameCount++;
    const now = performance.now();
    const elapsed = now - lastFpsTime;
    if (elapsed >= 1000) {
      fpsEl.textContent = Math.round(frameCount * 1000 / elapsed);
      frameCount = 0;
      lastFpsTime = now;
    }
  }

  function connect() {
    const ws = new WebSocket(wsUrl);
    ws.binaryType = "arraybuffer";

    ws.onopen = function() {
      statusEl.textContent = "Connected";
      statusEl.classList.remove("disconnected");
      overlayEl.style.display = "none";
      reconnectDelay = 1000;
    };

    ws.onmessage = function(event) {
      if (typeof event.data === "string" || event.data instanceof String) {
        // JSON metadata
        try {
          pendingMeta = JSON.parse(event.data);
          if (pendingMeta.step !== undefined) stepEl.textContent = pendingMeta.step;
          if (pendingMeta.episode !== undefined) episodeEl.textContent = pendingMeta.episode;
        } catch(e) {}
        return;
      }

      // Binary JPEG frame
      const blob = new Blob([event.data], { type: "image/jpeg" });
      const url = URL.createObjectURL(blob);
      frameEl.src = url;
      if (prevBlobUrl) URL.revokeObjectURL(prevBlobUrl);
      prevBlobUrl = url;
      updateFps();
    };

    ws.onclose = function() {
      statusEl.textContent = "Disconnected";
      statusEl.classList.add("disconnected");
      overlayEl.style.display = "";
      overlayEl.textContent = "Reconnecting in " + (reconnectDelay / 1000) + "s...";
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 8000);
    };

    ws.onerror = function() {
      ws.close();
    };
  }

  connect();
})();
</script>
</body>
</html>
